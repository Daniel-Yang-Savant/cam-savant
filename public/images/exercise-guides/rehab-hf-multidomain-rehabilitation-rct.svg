<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
    <title id="title">心衰竭住院後：REHAB-HF 的四面向功能復健：研究方案圖解</title>
    <desc id="desc">年長心衰竭患者接受支撐平衡、起身力量、轉位步行與耐力分段訓練的四面向示意</desc>
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#116d69"/></marker></defs>
    <rect width="1200" height="900" fill="#eef3f5"/>
    <g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif">
      <rect width="1200" height="140" fill="#193244"/>
      <text x="38" y="38" fill="#a9cbd4" font-size="18" letter-spacing="3">CAM SAVANT / RESEARCH GUIDE</text>
      <text x="36" y="93" fill="#ffffff" font-size="34" font-weight="700"><tspan x="36" dy="0">心衰竭住院後體能</tspan></text>
      <text x="1164" y="125" text-anchor="end" fill="#c1d7dd" font-size="17">方案概念・完整說明請見內文</text>
      <g transform="translate(36 165)"><rect width="552" height="304" rx="22" fill="white" stroke="#dce5e9"/>
      <rect x="24" y="23" width="40" height="40" rx="13" fill="#116d69"/>
      <text x="44" y="51" text-anchor="middle" fill="white" font-size="25" font-weight="700">1</text>
      <text x="80" y="52" fill="#1e3445" font-size="25" font-weight="700"><tspan x="80" dy="0">平衡與安全支撐</tspan></text>
      <svg x="28" y="102" width="184" height="171" viewBox="0 0 190 180"><path d="M15 155 H175" fill="none" stroke="#ccd9df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="87" cy="27" r="11" fill="#f1d6bc" stroke="#253d50" stroke-width="3"/><path d="M87 47 V95 M87 59 L55 66 L28 54 M87 59 L120 66 L147 53 M87 95 L74 119 L62 150 M87 95 L113 111 L129 139" fill="none" stroke="#253d50" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M42 139 Q86 121 138 143" fill="none" stroke="#116d69" stroke-width="3" stroke-dasharray="5 5" marker-end="url(#arrow)"/></svg>
      <text x="236" y="128" fill="#486071" font-size="20" font-weight="400"><tspan x="236" dy="0">治療師先確認坐站穩定度，選擇</tspan><tspan x="236" dy="28.4">需要的扶手與協助；圖解的站姿</tspan><tspan x="236" dy="28.4">不代表每個人已經可以站立。</tspan></text>
    </g><g transform="translate(612 165)"><rect width="552" height="304" rx="22" fill="white" stroke="#dce5e9"/>
      <rect x="24" y="23" width="40" height="40" rx="13" fill="#116d69"/>
      <text x="44" y="51" text-anchor="middle" fill="white" font-size="25" font-weight="700">2</text>
      <text x="80" y="52" fill="#1e3445" font-size="25" font-weight="700"><tspan x="80" dy="0">起身與下肢力量</tspan></text>
      <svg x="28" y="102" width="184" height="171" viewBox="0 0 190 180"><path d="M15 155 H175" fill="none" stroke="#ccd9df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 78 V116 H92 M35 116 V152 M86 116 V152" fill="none" stroke="#98adb9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="64" cy="32" r="11" fill="#f1d6bc" stroke="#253d50" stroke-width="3"/><path d="M62 51 L65 103 H118 L124 146 H145 M62 65 L96 82 L118 80" fill="none" stroke="#253d50" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M153 132 V52" fill="none" stroke="#116d69" stroke-width="3" stroke-dasharray="5 5" marker-end="url(#arrow)"/></svg>
      <text x="236" y="128" fill="#486071" font-size="20" font-weight="400"><tspan x="236" dy="0">把從椅子起身等生活任務列為力</tspan><tspan x="236" dy="28.4">量目標，座高、扶手及協助量均</tspan><tspan x="236" dy="28.4">由治療師設定。</tspan></text>
    </g><g transform="translate(36 491)"><rect width="552" height="304" rx="22" fill="white" stroke="#dce5e9"/>
      <rect x="24" y="23" width="40" height="40" rx="13" fill="#116d69"/>
      <text x="44" y="51" text-anchor="middle" fill="white" font-size="25" font-weight="700">3</text>
      <text x="80" y="52" fill="#1e3445" font-size="25" font-weight="700"><tspan x="80" dy="0">移動與步行</tspan></text>
      <svg x="28" y="102" width="184" height="171" viewBox="0 0 190 180"><path d="M15 155 H175" fill="none" stroke="#ccd9df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="87" cy="30" r="11" fill="#f1d6bc" stroke="#253d50" stroke-width="3"/><path d="M84 49 L90 93 M85 58 L65 82 L41 77 M87 59 L113 75 L134 56 M90 93 L62 119 L42 150 M90 93 L116 119 L145 141" fill="none" stroke="#253d50" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M38 164 H147" fill="none" stroke="#116d69" stroke-width="3" stroke-dasharray="5 5" marker-end="url(#arrow)"/></svg>
      <text x="236" y="128" fill="#486071" font-size="20" font-weight="400"><tspan x="236" dy="0">在適當協助下練習轉位、走路及</tspan><tspan x="236" dy="28.4">方向改變，先確保動作安全，再</tspan><tspan x="236" dy="28.4">延長活動範圍。</tspan></text>
    </g><g transform="translate(612 491)"><rect width="552" height="304" rx="22" fill="white" stroke="#dce5e9"/>
      <rect x="24" y="23" width="40" height="40" rx="13" fill="#116d69"/>
      <text x="44" y="51" text-anchor="middle" fill="white" font-size="25" font-weight="700">4</text>
      <text x="80" y="52" fill="#1e3445" font-size="25" font-weight="700"><tspan x="80" dy="0">分段累積耐力</tspan></text>
      <svg x="28" y="102" width="184" height="171" viewBox="0 0 190 180"><path d="M15 155 H175" fill="none" stroke="#ccd9df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="87" cy="30" r="11" fill="#f1d6bc" stroke="#253d50" stroke-width="3"/><path d="M84 49 L90 93 M85 58 L65 82 L41 77 M87 59 L113 75 L134 56 M90 93 L62 119 L42 150 M90 93 L116 119 L145 141" fill="none" stroke="#253d50" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M38 164 H147" fill="none" stroke="#116d69" stroke-width="3" stroke-dasharray="5 5" marker-end="url(#arrow)"/></svg>
      <text x="236" y="128" fill="#486071" font-size="20" font-weight="400"><tspan x="236" dy="0">把可耐受的活動與休息交替，逐</tspan><tspan x="236" dy="28.4">步銜接出院後課程；心肺反應與</tspan><tspan x="236" dy="28.4">疲倦均納入調整。</tspan></text>
    </g>
      <text x="600" y="861" text-anchor="middle" fill="#486071" font-size="20">原創研究方案示意・非論文原圖・非個人運動處方</text>
    </g>
  </svg>
