<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
    <title id="title">Nordic 腿後肌訓練：漸進導入足球防傷：研究方案圖解</title>
    <desc id="desc">Nordic 腿後肌訓練的安全固定、前傾下放與漸進安排的原創代表性研究流程示意圖，並非完整或個人化運動處方</desc>
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#477341"/></marker></defs>
    <rect width="1200" height="900" fill="#eef3f5"/>
    <g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif">
      <rect width="1200" height="140" fill="#193244"/>
      <text x="38" y="38" fill="#a9cbd4" font-size="18" letter-spacing="3">CAM SAVANT / RESEARCH GUIDE</text>
      <text x="36" y="93" fill="#ffffff" font-size="34" font-weight="700"><tspan x="36" dy="0">足球腿後肌防傷</tspan></text>
      <text x="1164" y="125" text-anchor="end" fill="#c1d7dd" font-size="17">方案概念・完整說明請見內文</text>
      <g transform="translate(36 165)"><rect width="552" height="304" rx="22" fill="white" stroke="#dce5e9"/>
      <rect x="24" y="23" width="40" height="40" rx="13" fill="#477341"/>
      <text x="44" y="51" text-anchor="middle" fill="white" font-size="25" font-weight="700">1</text>
      <text x="80" y="52" fill="#1e3445" font-size="25" font-weight="700"><tspan x="80" dy="0">確認適合加入防傷訓練</tspan></text>
      <svg x="28" y="102" width="184" height="171" viewBox="0 0 190 180"><path d="M15 155 H175" fill="none" stroke="#ccd9df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="53" cy="32" r="11" fill="#f1d6bc" stroke="#253d50" stroke-width="3"/><circle cx="139" cy="32" r="11" fill="#f1d6bc" stroke="#253d50" stroke-width="3"/><path d="M52 52 V93 L69 115 V150 M52 64 L84 82 M138 52 V93 L121 115 V150 M138 64 L111 82" fill="none" stroke="#253d50" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M78 94 H118 M97 94 V150 M22 83 V108 H52 M143 108 H172 V83" fill="none" stroke="#98adb9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M135 68 H143 M139 64 V72" stroke="#477341" stroke-width="3"/></svg>
      <text x="236" y="128" fill="#486071" font-size="20" font-weight="400"><tspan x="236" dy="0">由教練或治療師檢查近期拉傷、</tspan><tspan x="236" dy="28.4">膝部跪姿耐受與既有訓練量。</tspan></text>
    </g><g transform="translate(612 165)"><rect width="552" height="304" rx="22" fill="white" stroke="#dce5e9"/>
      <rect x="24" y="23" width="40" height="40" rx="13" fill="#477341"/>
      <text x="44" y="51" text-anchor="middle" fill="white" font-size="25" font-weight="700">2</text>
      <text x="80" y="52" fill="#1e3445" font-size="25" font-weight="700"><tspan x="80" dy="0">建立穩定跪姿與固定</tspan></text>
      <svg x="28" y="102" width="184" height="171" viewBox="0 0 190 180"><path d="M15 155 H175" fill="none" stroke="#ccd9df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="114" cy="38" r="11" fill="#f1d6bc" stroke="#253d50" stroke-width="3"/><path d="M103 54 L72 109 L68 141 H28 M102 60 L131 91 L151 110" fill="none" stroke="#253d50" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 143 H61" fill="none" stroke="#477341" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M128 26 Q164 44 172 83" fill="none" stroke="#477341" stroke-width="3" stroke-dasharray="5 5" marker-end="url(#arrow)"/></svg>
      <text x="236" y="128" fill="#486071" font-size="20" font-weight="400"><tspan x="236" dy="0">雙膝放在合適軟墊上，踝部由可</tspan><tspan x="236" dy="28.4">靠夥伴或經確認的設備固定，軀</tspan><tspan x="236" dy="28.4">幹與大腿保持可控制的位置。</tspan></text>
    </g><g transform="translate(36 491)"><rect width="552" height="304" rx="22" fill="white" stroke="#dce5e9"/>
      <rect x="24" y="23" width="40" height="40" rx="13" fill="#477341"/>
      <text x="44" y="51" text-anchor="middle" fill="white" font-size="25" font-weight="700">3</text>
      <text x="80" y="52" fill="#1e3445" font-size="25" font-weight="700"><tspan x="80" dy="0">控制前傾並安全接手</tspan></text>
      <svg x="28" y="102" width="184" height="171" viewBox="0 0 190 180"><path d="M15 155 H175" fill="none" stroke="#ccd9df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="114" cy="38" r="11" fill="#f1d6bc" stroke="#253d50" stroke-width="3"/><path d="M103 54 L72 109 L68 141 H28 M102 60 L131 91 L151 110" fill="none" stroke="#253d50" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 143 H61" fill="none" stroke="#477341" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M128 26 Q164 44 172 83" fill="none" stroke="#477341" stroke-width="3" stroke-dasharray="5 5" marker-end="url(#arrow)"/></svg>
      <text x="236" y="128" fill="#486071" font-size="20" font-weight="400"><tspan x="236" dy="0">在能控制的範圍內緩慢前傾，用</tspan><tspan x="236" dy="28.4">腿後肌抵抗下放；接近失去控制</tspan><tspan x="236" dy="28.4">前以雙手承接。</tspan></text>
    </g><g transform="translate(612 491)"><rect width="552" height="304" rx="22" fill="white" stroke="#dce5e9"/>
      <rect x="24" y="23" width="40" height="40" rx="13" fill="#477341"/>
      <text x="44" y="51" text-anchor="middle" fill="white" font-size="25" font-weight="700">4</text>
      <text x="80" y="52" fill="#1e3445" font-size="25" font-weight="700"><tspan x="80" dy="0">把進階與賽季維持排進行事曆</tspan></text>
      <svg x="28" y="102" width="184" height="171" viewBox="0 0 190 180"><path d="M15 155 H175" fill="none" stroke="#ccd9df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="44" y="22" width="108" height="139" rx="10" fill="white" stroke="#253d50" stroke-width="5"/><rect x="73" y="15" width="48" height="18" rx="5" fill="#477341"/><path d="M62 60 L67 65 L78 52 M90 59 H131 M62 95 L67 100 L78 87 M90 94 H131 M62 130 L67 135 L78 122 M90 129 H131" fill="none" stroke="#477341" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <text x="236" y="128" fill="#486071" font-size="20" font-weight="400"><tspan x="236" dy="0">配合球隊賽程與恢復情況逐步增</tspan><tspan x="236" dy="28.4">加負荷，注意隔日痠痛是否影響</tspan><tspan x="236" dy="28.4">跑步。</tspan></text>
    </g>
      <text x="600" y="861" text-anchor="middle" fill="#486071" font-size="20">原創研究方案示意・非論文原圖・非個人運動處方</text>
    </g>
  </svg>
