<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
    <title id="title">失智症：體能訓練不能保證減緩認知退化：研究方案圖解</title>
    <desc id="desc">DAPA 的個別評估、監督式固定腳踏車、肌力訓練及認知生活功能追蹤四格示意</desc>
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#7056a6"/></marker></defs>
    <rect width="1200" height="900" fill="#eef3f5"/>
    <g font-family="PingFang TC, Noto Sans CJK TC, Microsoft JhengHei, sans-serif">
      <rect width="1200" height="140" fill="#193244"/>
      <text x="38" y="38" fill="#a9cbd4" font-size="18" letter-spacing="3">CAM SAVANT / RESEARCH GUIDE</text>
      <text x="36" y="93" fill="#ffffff" font-size="34" font-weight="700"><tspan x="36" dy="0">失智症運動與認知</tspan></text>
      <text x="1164" y="125" text-anchor="end" fill="#c1d7dd" font-size="17">方案概念・完整說明請見內文</text>
      <g transform="translate(36 165)"><rect width="552" height="304" rx="22" fill="white" stroke="#dce5e9"/>
      <rect x="24" y="23" width="40" height="40" rx="13" fill="#7056a6"/>
      <text x="44" y="51" text-anchor="middle" fill="white" font-size="25" font-weight="700">1</text>
      <text x="80" y="52" fill="#1e3445" font-size="25" font-weight="700"><tspan x="80" dy="0">先訂生活與體能目標</tspan></text>
      <svg x="28" y="102" width="184" height="171" viewBox="0 0 190 180"><path d="M15 155 H175" fill="none" stroke="#ccd9df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="53" cy="32" r="11" fill="#f1d6bc" stroke="#253d50" stroke-width="3"/><circle cx="139" cy="32" r="11" fill="#f1d6bc" stroke="#253d50" stroke-width="3"/><path d="M52 52 V93 L69 115 V150 M52 64 L84 82 M138 52 V93 L121 115 V150 M138 64 L111 82" fill="none" stroke="#253d50" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M78 94 H118 M97 94 V150 M22 83 V108 H52 M143 108 H172 V83" fill="none" stroke="#98adb9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M135 68 H143 M139 64 V72" stroke="#7056a6" stroke-width="3"/></svg>
      <text x="236" y="128" fill="#486071" font-size="20" font-weight="400"><tspan x="236" dy="0">團隊評估疾病、用藥、理解指令</tspan><tspan x="236" dy="28.4">及活動能力，並與本人及照顧者</tspan><tspan x="236" dy="28.4">討論目標。</tspan></text>
    </g><g transform="translate(612 165)"><rect width="552" height="304" rx="22" fill="white" stroke="#dce5e9"/>
      <rect x="24" y="23" width="40" height="40" rx="13" fill="#7056a6"/>
      <text x="44" y="51" text-anchor="middle" fill="white" font-size="25" font-weight="700">2</text>
      <text x="80" y="52" fill="#1e3445" font-size="25" font-weight="700"><tspan x="80" dy="0">監督式固定車訓練</tspan></text>
      <svg x="28" y="102" width="184" height="171" viewBox="0 0 190 180"><path d="M15 155 H175" fill="none" stroke="#ccd9df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="119" cy="123" r="24" fill="white" stroke="#98adb9" stroke-width="5"/><path d="M30 153 H169 M50 153 L81 123 L69 75" fill="none" stroke="#98adb9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M81 123 H119 L137 62 H158 M55 72 H82" fill="none" stroke="#7056a6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="108" cy="23" r="11" fill="#f1d6bc" stroke="#253d50" stroke-width="3"/><path d="M99 40 L78 65 L105 91 L89 123 M99 43 L120 57 L140 60" fill="none" stroke="#253d50" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <text x="236" y="128" fill="#486071" font-size="20" font-weight="400"><tspan x="236" dy="0">研究在治療師與助理帶領下，以</tspan><tspan x="236" dy="28.4">固定腳踏車進行有氧活動，依耐</tspan><tspan x="236" dy="28.4">受調整負荷；本圖只介紹曾被研</tspan><tspan x="236" dy="28.4">究的流程。</tspan></text>
    </g><g transform="translate(36 491)"><rect width="552" height="304" rx="22" fill="white" stroke="#dce5e9"/>
      <rect x="24" y="23" width="40" height="40" rx="13" fill="#7056a6"/>
      <text x="44" y="51" text-anchor="middle" fill="white" font-size="25" font-weight="700">3</text>
      <text x="80" y="52" fill="#1e3445" font-size="25" font-weight="700"><tspan x="80" dy="0">加入個別化肌力活動</tspan></text>
      <svg x="28" y="102" width="184" height="171" viewBox="0 0 190 180"><path d="M15 155 H175" fill="none" stroke="#ccd9df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="95" cy="25" r="11" fill="#f1d6bc" stroke="#253d50" stroke-width="3"/><path d="M95 45 V94 M95 59 L65 77 L45 59 M95 59 L125 77 L145 59 M95 94 L75 148 M95 94 L116 148" fill="none" stroke="#253d50" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M31 56 H59 M31 46 V66 M59 46 V66 M132 56 H160 M132 46 V66 M160 46 V66" fill="none" stroke="#7056a6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <text x="236" y="128" fill="#486071" font-size="20" font-weight="400"><tspan x="236" dy="0">研究使用啞鈴手臂活動及坐站訓</tspan><tspan x="236" dy="28.4">練，負重依能力調整。</tspan></text>
    </g><g transform="translate(612 491)"><rect width="552" height="304" rx="22" fill="white" stroke="#dce5e9"/>
      <rect x="24" y="23" width="40" height="40" rx="13" fill="#7056a6"/>
      <text x="44" y="51" text-anchor="middle" fill="white" font-size="25" font-weight="700">4</text>
      <text x="80" y="52" fill="#1e3445" font-size="25" font-weight="700"><tspan x="80" dy="0">把認知與體能分開追蹤</tspan></text>
      <svg x="28" y="102" width="184" height="171" viewBox="0 0 190 180"><path d="M15 155 H175" fill="none" stroke="#ccd9df" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="44" y="22" width="108" height="139" rx="10" fill="white" stroke="#253d50" stroke-width="5"/><rect x="73" y="15" width="48" height="18" rx="5" fill="#7056a6"/><path d="M62 60 L67 65 L78 52 M90 59 H131 M62 95 L67 100 L78 87 M90 94 H131 M62 130 L67 135 L78 122 M90 129 H131" fill="none" stroke="#7056a6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <text x="236" y="128" fill="#486071" font-size="20" font-weight="400"><tspan x="236" dy="0">記錄活動參與、日常功能、情緒</tspan><tspan x="236" dy="28.4">及照顧負擔。</tspan></text>
    </g>
      <text x="600" y="861" text-anchor="middle" fill="#486071" font-size="20">原創研究方案示意・非論文原圖・非個人運動處方</text>
    </g>
  </svg>
